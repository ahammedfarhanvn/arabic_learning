{% extends 'users/base.html' %}
{% load static %}
    {% block content %}
    <div class="container">
        <a href="{% url 'question_list' %}" class="btn btn-primary border-light mt-4">Go to Questions List</a>
        <h1 class="mt-1">Add New Question</h1>
        <form method="post" enctype="multipart/form-data" class="mt-3 form-control">
            {% csrf_token %}
            <div class="form-group">
                <label for="category">Category:</label>
                <input type="text" name="category" class="form-control" placeholder="Enter Category" required>
            </div>
            <div class="form-group">
                <label for="question_text">Question Text:</label>
                <input type="text" name="question_text" class="form-control" placeholder="Enter Question Text" required>
            </div>
            <div class="form-group">
                <label for="option_a">Option A:</label>
                <input type="text" name="option_a" class="form-control" placeholder="Enter Option A" required>
            </div>
            <div class="form-group">
                <label for="option_b">Option B:</label>
                <input type="text" name="option_b" class="form-control" placeholder="Enter Option B" required>
            </div>
            <div class="form-group">
                <label for="option_c">Option C:</label>
                <input type="text" name="option_c" class="form-control" placeholder="Enter Option C" required>
            </div>
            <div class="form-group">
                <label for="option_d">Option D:</label>
                <input type="text" name="option_d" class="form-control" placeholder="Enter Option D" required>
            </div>
            <div class="form-group">
                <label for="correct_answer">Correct Answer:</label>
                <input type="text" name="correct_answer" class="form-control" placeholder="Enter Correct Answer" required>
            </div>
            <div class="form-group">
                <label for="level">Level:</label>
                <input type="number" name="level" class="form-control" placeholder="Enter Level" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Question</button>
        </form>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}
    
{% endblock content %}
